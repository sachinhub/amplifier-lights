services:
  - type: web
    name: amplifier-lights-api
    env: node
    plan: starter
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: amplifier-lights-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: amplifier-lights-redis
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: GPTBOT_RATE_LIMIT
        value: 200
      - key: CLAUDEBOT_RATE_LIMIT
        value: 200
      - key: PERPLEXITYBOT_RATE_LIMIT
        value: 200
      - key: CACHE_TTL
        value: 300
      - key: AVAILABILITY_CACHE_TTL
        value: 60

databases:
  - name: amplifier-lights-db
    databaseName: amplifier_light
    user: amplifier_light_user
    plan: starter

redis:
  - name: amplifier-lights-redis
    plan: starter
